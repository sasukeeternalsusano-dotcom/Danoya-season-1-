<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><!DOCTYPE html>
<html lang="en">
<head>

<title>Danoya's compliment jar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eefb;--ink:#26305a;--glass:#ffffffaa;--slip:#ffe27a;--slip2:#ffc2d4;--lid:#6c7bd9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c33;--ink:#eef0ff;--glass:#ffffff22}}
:root[data-theme="dark"]{--bg:#171c33;--ink:#eef0ff;--glass:#ffffff22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px;text-align:center}
h1{font-size:1.6rem;margin:0 0 6px;font-weight:700}
p.sub{margin:0 0 22px;opacity:.75}
.jar{position:relative;width:220px;height:240px;border:4px solid var(--lid);border-radius:28px 28px 48px 48px;background:var(--glass);overflow:hidden;cursor:pointer;padding:0;transition:transform .2s}
.jar:active{transform:scale(.97)}
.jar:focus-visible,button:focus-visible{outline:3px solid var(--lid);outline-offset:4px}
.lid{width:170px;height:26px;background:var(--lid);border-radius:10px 10px 4px 4px;margin-bottom:-2px}
.s{position:absolute;width:56px;height:30px;border-radius:4px;background:var(--slip)}
.s:nth-child(2n){background:var(--slip2)}
.jar.shake{animation:sh .5s}
@keyframes sh{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.jar.shake{animation:none}}
.note{margin:26px 0 0;max-width:340px;min-height:120px;padding:22px 20px;background:var(--slip);color:#3a2f00;border-radius:6px;font-size:1.2rem;line-height:1.45;box-shadow:0 6px 0 #0002;transform:rotate(-1.5deg)}
.hint{margin-top:14px;font-size:.9rem;opacity:.7}
</style>
</head>
<body>
<h1>Danoya's compliment jar</h1>
<p class="sub">Tap the jar whenever you need it.</p>
<div class="lid"></div>
<button class="jar" id="jar" aria-label="Pull a compliment from the jar"></button>
<div class="note" id="note" aria-live="polite">Your compliment will show up here.</div>
<div class="hint" id="hint">20 notes inside</div>
<script>
const C=[
"You make ordinary days feel lighter just by being in them.",
"Your laugh is genuinely contagious.",
"You're stronger than you give yourself credit for.",
"People feel better after talking to you, and that's rare.",
"You handle hard things with more grace than you realize.",
"Your kindness is never for show, and everyone can tell.",
"You're allowed to rest. You've earned it.",
"Your ideas are good. Trust them.",
"You notice small things about people, and it matters.",
"You're someone's favorite part of the day. Probably many people's.",
"The way you care about things is inspiring.",
"You're doing better than you think.",
"Your smile changes the whole room.",
"You're funny in a way that sneaks up on people.",
"You make hard days easier to get through.",
"You are enough, exactly as you are today.",
"You show up for people. That says a lot about you.",
"Your energy is one of a kind.",
"You've gotten through every tough day so far. That's a perfect record.",
"The world is better with you in it."];
let bag=[],last=-1;
const jar=document.getElementById('jar'),note=document.getElementById('note'),hint=document.getElementById('hint');
function fill(){for(let i=0;i<14;i++){const d=document.createElement('div');d.className='s';d.style.left=(Math.random()*160)+'px';d.style.top=(60+Math.random()*160)+'px';d.style.transform='rotate('+(Math.random()*90-45)+'deg)';jar.appendChild(d);}}
fill();
function pull(){
 if(!bag.length){bag=C.map((_,i)=>i).filter(i=>i!==last).sort(()=>Math.random()-.5);}
 last=bag.pop();
 note.textContent=C[last];
 hint.textContent=bag.length+' left before they start over';
 jar.classList.remove('shake');void jar.offsetWidth;jar.classList.add('shake');
}
jar.addEventListener('click',pull);
</script>
<script>

  var c=document.createElement("div");c.setAttribute("role","dialog");c.setAttribute("aria-label","Replay bonus");c.style.cssText="max-width:420px;width:100%;background:#fff6f0;color:#43102c;border:3px solid #e0407b;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 60px #0008";
  var k=document.createElement("div");k.textContent="✨ NEW FOR THE REPLAY";k.style.cssText="font-weight:800;letter-spacing:.2em;font-size:.72rem;color:#e0407b";
  var t=document.createElement("div");t.textContent=D.t;t.style.cssText="font-weight:800;font-size:1.1rem;margin:6px 0 10px";
  var p=document.createElement("p");p.textContent=D.x;p.style.cssText="margin:0 0 16px;font-size:1.05rem;line-height:1.5";
  var bt=document.createElement("button");bt.type="button";bt.textContent=got?"Close":"Collect ✨";bt.style.cssText="background:#e0407b;color:#fff;border:0;border-radius:99px;padding:11px 24px;cursor:pointer;"+S;
  bt.onclick=function(){if(!got){var s=g();s[D.k]=1;sv(s);got=true;lab()}o.remove()};
  o.onclick=function(e){if(e.target===o)o.remove()};
  c.appendChild(k);c.appendChild(t);c.appendChild(p);c.appendChild(bt);o.appendChild(c);document.body.appendChild(o);bt.focus();
};
(document.body||document.documentElement).appendChild(b);
})();
</script></body>
